<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kebun</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #a7c957; color: #283618; font-family: sans-serif; text-align: center; }
  .field { display: grid; grid-template-columns: repeat(4, 80px); gap: 8px; }
  .plot { width: 80px; height: 80px; border-radius: 10px; background: #7f5539; font-size: 40px; display: grid; place-items: center; cursor: pointer; user-select: none; }
  button { font-size: 16px; padding: 8px 14px; margin: 8px; border-radius: 8px; border: none; cursor: pointer; }
</style>
</head>
<body>
<div>
  <h2 id="money">Uang: 10</h2>
  <p>klik tanah kosong = tanam (2) · klik yang mateng = panen (+5)</p>
  <div class="field" id="field"></div>
  <button id="buy">beli lahan (20)</button>
</div>
<script>
  let growMs = 4000; // lama tumbuh
  let money = 10;
  const field = document.getElementById("field"), moneyEl = document.getElementById("money");
  const plots = [];
  const STAGES = ["", "🌱", "🌿", "🌾"];

  function addPlot() {
    const el = document.createElement("div");
    el.className = "plot";
    const p = { el, stage: 0, planted: 0 };
    el.onclick = () => {
      if (p.stage === 0 && money >= 2) { money -= 2; p.stage = 1; p.planted = Date.now(); }
      else if (p.stage === 3) { money += 5; p.stage = 0; }
      render();
    };
    field.appendChild(el);
    plots.push(p);
  }
  function render() {
    for (const p of plots) p.el.textContent = STAGES[p.stage];
    moneyEl.textContent = "Uang: " + money;
  }
  document.getElementById("buy").onclick = () => { if (money >= 20 && plots.length < 16) { money -= 20; addPlot(); render(); } };
  setInterval(() => {
    for (const p of plots) if (p.stage > 0 && p.stage < 3) p.stage = 1 + Math.min(2, Math.floor((Date.now() - p.planted) / (growMs / 2)));
    render();
  }, 300);
  for (let i = 0; i < 4; i++) addPlot();
  render();
</script>
</body>
</html>
