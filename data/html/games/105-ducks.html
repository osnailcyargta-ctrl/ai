<!-- things: critter=bebek:🦆 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tembak Bebek</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #6a040f; color: #fff; font-family: sans-serif; }
  canvas { background: linear-gradient(#90e0ef 60%, #2d6a4f 60%); border: 10px solid #9d0208; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game" width="520" height="340"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  let ammoMax = 15; // jumlah peluru
  let duckSpeed = 2; // kecepatan bebek
  let ducks = [], ammo = ammoMax, score = 0, flash = 0;

  cv.onclick = (e) => {
    if (ammo <= 0) { ammo = ammoMax; score = 0; ducks = []; return; }
    ammo--;
    flash = 4;
    for (const d of ducks) if (!d.hit && Math.hypot(d.x - e.offsetX, d.y - e.offsetY) < 22) { d.hit = true; score += d.row === 0 ? 3 : 1; break; }
  };

  function update() {
    if (Math.random() < 0.025) {
      const row = Math.floor(Math.random() * 3), dir = row % 2 ? -1 : 1;
      ducks.push({ x: dir > 0 ? -20 : W + 20, y: 50 + row * 55, row, dir, hit: false, fall: 0 });
    }
    for (const d of ducks) {
      if (d.hit) { d.fall += 4; d.y += 4; }
      else d.x += d.dir * (duckSpeed + (2 - d.row) * 0.8);
    }
    ducks = ducks.filter((d) => d.x > -40 && d.x < W + 40 && d.y < H);
    if (flash > 0) flash--;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#bc6c25";
    for (let r = 0; r < 3; r++) ctx.fillRect(0, 68 + r * 55, W, 6);
    ctx.font = "30px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const d of ducks) {
      ctx.save(); ctx.translate(d.x, d.y); if (d.dir > 0) ctx.scale(-1, 1); if (d.hit) ctx.rotate(Math.PI); ctx.fillText("🦆", 0, 0); ctx.restore();
    }
    if (flash) { ctx.fillStyle = "rgba(255, 255, 255, 0.3)"; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = "#fff";
    ctx.font = "18px sans-serif";
    ctx.fillText("Poin " + score + " · Peluru " + "•".repeat(ammo), W / 2, H - 16);
    if (ammo <= 0) { ctx.font = "26px sans-serif"; ctx.fillText("Peluru habis! poin " + score + " (klik)", W / 2, H / 2 + 60); }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
