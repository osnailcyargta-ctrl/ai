<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Asteroids</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: monospace; }
  canvas { background: #000; border: 1px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="520" height="400"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  let thrust = 0.12; // dorongan mesin
  let turnSpeed = 0.07; // kecepatan muter
  let rockCount = 5; // jumlah asteroid
  const ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0 };
  let rocks = [], bullets = [], score = 0, dead = false, cool = 0;
  const keys = {};
  onkeydown = (e) => { keys[e.key] = true; if (dead && e.key === "Enter") start(); };
  onkeyup = (e) => { keys[e.key] = false; };

  function rock(x, y, r) { return { x, y, r, vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1 }; }
  function start() {
    rocks = []; bullets = []; score = 0; dead = false;
    Object.assign(ship, { x: W / 2, y: H / 2, vx: 0, vy: 0 });
    for (let i = 0; i < rockCount; i++) rocks.push(rock(Math.random() * W, Math.random() < 0.5 ? 20 : H - 20, 40));
  }
  const wrap = (o) => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };

  function update() {
    if (dead) return;
    if (keys["ArrowLeft"]) ship.a -= turnSpeed;
    if (keys["ArrowRight"]) ship.a += turnSpeed;
    if (keys["ArrowUp"]) { ship.vx += Math.cos(ship.a) * thrust; ship.vy += Math.sin(ship.a) * thrust; }
    ship.vx *= 0.99; ship.vy *= 0.99;
    ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
    if (cool > 0) cool--;
    if (keys[" "] && !cool) { bullets.push({ x: ship.x, y: ship.y, vx: Math.cos(ship.a) * 7, vy: Math.sin(ship.a) * 7, life: 60 }); cool = 10; }
    for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; wrap(b); }
    const born = [];
    for (const r of rocks) {
      r.x += r.vx; r.y += r.vy; wrap(r);
      for (const b of bullets) if (b.life > 0 && Math.hypot(b.x - r.x, b.y - r.y) < r.r) {
        b.life = 0; r.dead = true; score += 10;
        if (r.r > 15) born.push(rock(r.x, r.y, r.r / 2), rock(r.x, r.y, r.r / 2));
      }
      if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 8) dead = true;
    }
    rocks = rocks.filter((r) => !r.dead).concat(born);
    bullets = bullets.filter((b) => b.life > 0);
    if (!rocks.length) { rockCount++; start(); }
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#fff";
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.a);
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, 8); ctx.lineTo(-6, 0); ctx.lineTo(-10, -8); ctx.closePath(); ctx.stroke();
    ctx.restore();
    for (const r of rocks) { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = "#fff";
    for (const b of bullets) ctx.fillRect(b.x - 1, b.y - 1, 3, 3);
    ctx.font = "16px monospace";
    ctx.fillText("SKOR " + score, 10, 20);
    if (dead) ctx.fillText("MELEDAK! ENTER BUAT ULANG", W / 2 - 110, H / 2);
  }

  start();
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
