<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Todo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding-top: 60px; background: #eef2f7; font-family: sans-serif; }
  .app { width: 340px; background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 4px 16px #0001; }
  input { width: 70%; font-size: 16px; padding: 8px; }
  li { list-style: none; padding: 8px 0; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: center; }
  li.done span { text-decoration: line-through; color: #aaa; }
  li button { margin-left: auto; border: none; background: none; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <h2>Tugas Aku</h2>
  <input id="text" placeholder="tugas baru..."> <button id="add">tambah</button>
  <ul id="list"></ul>
  <p id="count"></p>
</div>
<script>
  const list = document.getElementById("list"), text = document.getElementById("text"), count = document.getElementById("count");
  let todos = JSON.parse(localStorage.getItem("todos") || "[]");

  function save() { localStorage.setItem("todos", JSON.stringify(todos)); render(); }

  function render() {
    list.innerHTML = "";
    todos.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = t.done;
      box.onchange = () => { t.done = box.checked; save(); };
      const span = document.createElement("span");
      span.textContent = t.text;
      const del = document.createElement("button");
      del.textContent = "🗑️";
      del.onclick = () => { todos.splice(i, 1); save(); };
      li.append(box, span, del);
      list.appendChild(li);
    });
    count.textContent = todos.filter((t) => !t.done).length + " belum selesai";
  }

  function add() {
    if (!text.value.trim()) return;
    todos.push({ text: text.value.trim(), done: false });
    text.value = "";
    save();
  }
  document.getElementById("add").onclick = add;
  text.onkeydown = (e) => { if (e.key === "Enter") add(); };
  render();
</script>
</body>
</html>
