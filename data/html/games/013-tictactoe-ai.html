<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tic Tac Toe</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; }
  .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 6px; }
  .cell { width: 90px; height: 90px; background: #313244; border: none; border-radius: 10px; font-size: 48px; color: #f5c2e7; cursor: pointer; }
  .cell:hover { background: #45475a; }
  p { text-align: center; font-size: 20px; }
  button.again { display: block; margin: 12px auto; padding: 8px 18px; font-size: 16px; }
</style>
</head>
<body>
<div>
  <p id="msg">Kamu X, giliran kamu</p>
  <div class="board" id="board"></div>
  <button class="again" id="again">Main lagi</button>
</div>
<script>
  const boardEl = document.getElementById("board"), msg = document.getElementById("msg");
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  let cells = Array(9).fill(""), over = false;
  const buttons = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.onclick = () => play(i);
    boardEl.appendChild(b);
    buttons.push(b);
  }

  function winner(c) {
    for (const [a, b, d] of LINES) if (c[a] && c[a] === c[b] && c[a] === c[d]) return c[a];
    return c.every((x) => x) ? "seri" : null;
  }

  function cpuMove() {
    const free = cells.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
    for (const who of ["O", "X"]) {
      for (const i of free) {
        const t = cells.slice(); t[i] = who;
        if (winner(t) === who) return i;
      }
    }
    if (!cells[4]) return 4;
    return free[Math.floor(Math.random() * free.length)];
  }

  function finish() {
    const w = winner(cells);
    if (!w) return false;
    over = true;
    msg.textContent = w === "seri" ? "Seri!" : w === "X" ? "Kamu menang! 🎉" : "Komputer menang 🤖";
    return true;
  }

  function play(i) {
    if (over || cells[i]) return;
    cells[i] = "X";
    render();
    if (finish()) return;
    cells[cpuMove()] = "O";
    render();
    finish();
  }

  function render() { cells.forEach((v, i) => { buttons[i].textContent = v; }); }

  document.getElementById("again").onclick = () => { cells = Array(9).fill(""); over = false; msg.textContent = "Kamu X, giliran kamu"; render(); };
</script>
</body>
</html>
