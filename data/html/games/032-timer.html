<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Timer</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffe5d9; color: #3d405b; font-family: sans-serif; text-align: center; }
  #left { font-size: 80px; font-weight: bold; }
  input { width: 70px; font-size: 22px; text-align: center; }
  button { font-size: 18px; padding: 8px 18px; border-radius: 8px; border: none; background: #e07a5f; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div>
  <div id="left">05:00</div>
  <input id="min" type="number" value="5" min="0"> menit
  <input id="sec" type="number" value="0" min="0" max="59"> detik
  <p><button id="go">mulai</button> <button id="stop">stop</button></p>
  <p id="msg"></p>
</div>
<script>
  const leftEl = document.getElementById("left"), msg = document.getElementById("msg");
  let remaining = 300, timer = null;

  function show() {
    leftEl.textContent = String(Math.floor(remaining / 60)).padStart(2, "0") + ":" + String(remaining % 60).padStart(2, "0");
  }

  document.getElementById("go").onclick = () => {
    clearInterval(timer);
    remaining = Number(document.getElementById("min").value) * 60 + Number(document.getElementById("sec").value);
    msg.textContent = "";
    show();
    timer = setInterval(() => {
      remaining--;
      show();
      if (remaining <= 0) {
        clearInterval(timer);
        msg.textContent = "⏰ Waktu habis!";
        document.body.style.background = "#f28482";
      }
    }, 1000);
  };
  document.getElementById("stop").onclick = () => { clearInterval(timer); document.body.style.background = ""; };
  show();
</script>
</body>
</html>
