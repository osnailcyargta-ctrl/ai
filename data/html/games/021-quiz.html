<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kuis</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1faee; color: #1d3557; font-family: sans-serif; }
  .box { width: 360px; text-align: center; }
  .opt { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 17px; border-radius: 10px; border: 2px solid #a8dadc; background: #fff; cursor: pointer; }
  .opt.right { background: #8ac926; color: #fff; }
  .opt.wrong { background: #e63946; color: #fff; }
</style>
</head>
<body>
<div class="box">
  <p id="progress"></p>
  <h2 id="question"></h2>
  <div id="options"></div>
</div>
<script>
  const QUESTIONS = [
    { q: "Ibukota Indonesia?", a: ["Jakarta", "Bandung", "Surabaya", "Medan"], right: 0 },
    { q: "Planet paling gede?", a: ["Bumi", "Mars", "Jupiter", "Venus"], right: 2 },
    { q: "5 x 6 = ?", a: ["11", "30", "56", "25"], right: 1 },
    { q: "Hewan paling cepat di darat?", a: ["Kuda", "Singa", "Cheetah", "Rusa"], right: 2 },
    { q: "Air mendidih di suhu?", a: ["50°C", "100°C", "75°C", "0°C"], right: 1 },
  ];
  let i = 0, score = 0, locked = false;
  const qEl = document.getElementById("question"), optEl = document.getElementById("options"), prog = document.getElementById("progress");

  function show() {
    if (i >= QUESTIONS.length) {
      qEl.textContent = "Skor kamu " + score + " dari " + QUESTIONS.length;
      optEl.innerHTML = "";
      const again = document.createElement("button");
      again.className = "opt";
      again.textContent = "Ulang";
      again.onclick = () => { i = 0; score = 0; show(); };
      optEl.appendChild(again);
      return;
    }
    const item = QUESTIONS[i];
    prog.textContent = "Soal " + (i + 1) + " / " + QUESTIONS.length + " · Skor " + score;
    qEl.textContent = item.q;
    optEl.innerHTML = "";
    locked = false;
    item.a.forEach((text, k) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = text;
      b.onclick = () => {
        if (locked) return;
        locked = true;
        b.classList.add(k === item.right ? "right" : "wrong");
        optEl.children[item.right].classList.add("right");
        if (k === item.right) score++;
        setTimeout(() => { i++; show(); }, 900);
      };
      optEl.appendChild(b);
    });
  }
  show();
</script>
</body>
</html>
