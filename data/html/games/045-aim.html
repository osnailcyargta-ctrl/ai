<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aim Trainer</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #14213d; color: #fff; font-family: sans-serif; }
  canvas { background: #1f2f55; border-radius: 10px; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game" width="520" height="380"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  let targets = 20; // jumlah target
  let radius = 22; // ukuran target
  let hit = 0, miss = 0, start = 0, target = null, doneMs = 0;

  function place() { target = { x: radius + Math.random() * (W - radius * 2), y: radius + Math.random() * (H - radius * 2), born: performance.now() }; }

  cv.onclick = (e) => {
    if (!target) { hit = 0; miss = 0; start = performance.now(); place(); return; }
    if (Math.hypot(e.offsetX - target.x, e.offsetY - target.y) < radius) {
      hit++;
      if (hit >= targets) { doneMs = performance.now() - start; target = null; return; }
      place();
    } else miss++;
  };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    if (target) {
      const pulse = 1 + Math.sin((performance.now() - target.born) / 120) * 0.08;
      for (const [r, c] of [[1, "#e63946"], [0.66, "#fff"], [0.33, "#e63946"]]) {
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(target.x, target.y, radius * r * pulse, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "#fff";
      ctx.fillText(hit + " / " + targets + "   meleset " + miss, W / 2, 20);
    } else if (doneMs) {
      ctx.font = "24px sans-serif";
      ctx.fillText("Selesai! rata-rata " + Math.round(doneMs / targets) + " ms per target", W / 2, H / 2 - 10);
      ctx.font = "16px sans-serif";
      ctx.fillText("akurasi " + Math.round(hit / (hit + miss) * 100) + "% · klik buat ulang", W / 2, H / 2 + 22);
    } else ctx.fillText("klik buat mulai", W / 2, H / 2);
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
