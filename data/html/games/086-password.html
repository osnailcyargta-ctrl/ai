<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cek Password</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b090a; color: #f5f3f4; font-family: sans-serif; }
  .box { width: 320px; }
  input { width: 100%; font-size: 20px; padding: 8px; box-sizing: border-box; border-radius: 8px; border: none; }
  .meter { height: 10px; background: #333; border-radius: 5px; margin: 10px 0; overflow: hidden; }
  #bar { height: 100%; width: 0; transition: width 0.2s, background 0.2s; }
  li.ok { color: #52b788; }
</style>
</head>
<body>
<div class="box">
  <h2>Seberapa kuat password kamu?</h2>
  <input id="pw" type="password" placeholder="ketik password">
  <div class="meter"><div id="bar"></div></div>
  <p id="label"></p>
  <ul id="rules"></ul>
</div>
<script>
  const RULES = [
    ["minimal 8 karakter", (p) => p.length >= 8],
    ["ada huruf besar", (p) => /[A-Z]/.test(p)],
    ["ada huruf kecil", (p) => /[a-z]/.test(p)],
    ["ada angka", (p) => /\d/.test(p)],
    ["ada simbol", (p) => /[^A-Za-z0-9]/.test(p)],
  ];
  const pw = document.getElementById("pw"), bar = document.getElementById("bar"), label = document.getElementById("label"), rules = document.getElementById("rules");
  pw.oninput = () => {
    const p = pw.value, passed = RULES.map(([, test]) => test(p));
    const score = passed.filter(Boolean).length;
    rules.innerHTML = RULES.map(([text], i) => "<li class='" + (passed[i] ? "ok" : "") + "'>" + (passed[i] ? "✓ " : "✗ ") + text + "</li>").join("");
    const levels = [["", "#333"], ["lemah banget", "#e63946"], ["lemah", "#f77f00"], ["lumayan", "#fcbf49"], ["kuat", "#90be6d"], ["kuat banget 💪", "#2a9d8f"]];
    bar.style.width = score * 20 + "%";
    bar.style.background = levels[score][1];
    label.textContent = p ? levels[score][0] : "";
  };
  pw.oninput();
</script>
</body>
</html>
