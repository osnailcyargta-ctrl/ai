<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paint</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ddd; font-family: sans-serif; }
  canvas { background: #fff; cursor: crosshair; box-shadow: 0 2px 10px #0003; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
</style>
</head>
<body>
<div>
  <div class="bar" id="bar">
    <input id="size" type="range" min="1" max="40" value="6">
    <button id="clear">hapus</button>
    <button id="save">simpan</button>
  </div>
  <canvas id="pad" width="520" height="360"></canvas>
</div>
<script>
  const pad = document.getElementById("pad"), ctx = pad.getContext("2d"), bar = document.getElementById("bar");
  const COLORS = ["#000000", "#e63946", "#f4a261", "#2a9d8f", "#264653", "#8338ec", "#ffffff"];
  let color = COLORS[0], drawing = false, last = null;
  for (const c of COLORS) {
    const s = document.createElement("div");
    s.className = "swatch";
    s.style.background = c;
    s.onclick = () => { color = c; };
    bar.appendChild(s);
  }

  pad.onmousedown = (e) => { drawing = true; last = { x: e.offsetX, y: e.offsetY }; };
  onmouseup = () => { drawing = false; };
  pad.onmousemove = (e) => {
    if (!drawing) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = document.getElementById("size").value;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    last = { x: e.offsetX, y: e.offsetY };
  };
  document.getElementById("clear").onclick = () => ctx.clearRect(0, 0, pad.width, pad.height);
  document.getElementById("save").onclick = () => {
    const a = document.createElement("a");
    a.href = pad.toDataURL();
    a.download = "gambar.png";
    a.click();
  };
</script>
</body>
</html>
