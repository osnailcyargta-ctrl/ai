<!-- request: game dino lompatin kaktus | game lari lompat rintangan || jump over the cactus like the dino game | endless runner jumping over obstacles -->
<!-- things: hero=dinosaurus:🦖 foe=kaktus:🌵 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dinosaurus Lompat</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f4f1ea; font-family: monospace; }
  canvas { background: #fff; border-bottom: 3px solid #555; }
</style>
</head>
<body>
<canvas id="game" width="560" height="220"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, GROUND = H - 30;
  let gravity = 0.7; // gravitasi
  let jumpPower = -12; // kekuatan lompat
  let runSpeed = 5; // kecepatan awal
  let hero, foes, speed, score, over;

  function reset() { hero = { x: 60, y: GROUND, vy: 0 }; foes = []; speed = runSpeed; score = 0; over = false; }
  onkeydown = (e) => {
    if (e.key !== " " && e.key !== "ArrowUp") return;
    if (over) return reset();
    if (hero.y >= GROUND) hero.vy = jumpPower;
  };

  function update() {
    if (over) return;
    hero.vy += gravity;
    hero.y = Math.min(GROUND, hero.y + hero.vy);
    if (!foes.length || foes[foes.length - 1].x < W - 200 - Math.random() * 300) foes.push({ x: W + 20 });
    for (const f of foes) {
      f.x -= speed;
      if (Math.abs(f.x - hero.x) < 22 && hero.y > GROUND - 26) over = true;
    }
    foes = foes.filter((f) => f.x > -30);
    score++;
    speed = runSpeed + score / 600;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#555";
    ctx.fillRect(0, GROUND + 16, W, 2);
    ctx.font = "34px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🦖", hero.x, hero.y);
    for (const f of foes) ctx.fillText("🌵", f.x, GROUND);
    ctx.fillStyle = "#333";
    ctx.font = "16px monospace";
    ctx.textAlign = "right";
    ctx.fillText("SKOR " + String(Math.floor(score / 5)).padStart(5, "0"), W - 10, 20);
    if (over) { ctx.textAlign = "center"; ctx.fillText("KENA KAKTUS - SPASI BUAT ULANG", W / 2, H / 2 - 30); }
  }

  reset();
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
