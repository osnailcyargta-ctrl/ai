<!-- request: tebak angka 1 sampai 100 | game tebak nomor || guess the number from 1 to 100 | number guessing game -->
<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tebak Angka</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b2d42; color: #edf2f4; font-family: sans-serif; text-align: center; }
  input, button { font-size: 20px; padding: 8px 12px; border-radius: 8px; border: none; }
  button { background: #ef233c; color: #fff; cursor: pointer; }
  #hint { font-size: 22px; min-height: 30px; }
</style>
</head>
<body>
<div>
  <h1>Tebak Angka 1 - <span id="maxEl"></span></h1>
  <input id="guess" type="number" min="1">
  <button id="go">Tebak</button>
  <p id="hint">ayo tebak</p>
  <p id="tries">Percobaan: 0</p>
</div>
<script>
  let max = 100; // angka paling gede
  let secret = 1 + Math.floor(Math.random() * max), tries = 0;
  const guess = document.getElementById("guess"), hint = document.getElementById("hint"), triesEl = document.getElementById("tries");
  document.getElementById("maxEl").textContent = max;

  function check() {
    const n = Number(guess.value);
    if (!n) { hint.textContent = "isi angkanya dulu"; return; }
    tries++;
    triesEl.textContent = "Percobaan: " + tries;
    if (n < secret) hint.textContent = n + " kekecilan ⬆️";
    else if (n > secret) hint.textContent = n + " kegedean ⬇️";
    else {
      hint.textContent = "Bener! Angkanya " + secret + " 🎉 (angka baru dipilih)";
      secret = 1 + Math.floor(Math.random() * max);
      tries = 0;
    }
    guess.value = "";
    guess.focus();
  }
  document.getElementById("go").onclick = check;
  guess.onkeydown = (e) => { if (e.key === "Enter") check(); };
</script>
</body>
</html>
