<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Voting</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff1e6; font-family: sans-serif; }
  .poll { width: 340px; }
  .opt { margin: 10px 0; cursor: pointer; }
  .bar { height: 30px; background: #eee; border-radius: 8px; overflow: hidden; position: relative; }
  .fill { height: 100%; background: #f28482; transition: width 0.4s; }
  .label { position: absolute; left: 10px; top: 5px; }
</style>
</head>
<body>
<div class="poll">
  <h2>Makanan favorit kamu?</h2>
  <div id="opts"></div>
  <p id="total"></p>
</div>
<script>
  const OPTIONS = ["🍜 Mie ayam", "🍛 Nasi padang", "🍢 Sate", "🍕 Pizza"];
  let votes = OPTIONS.map(() => 0);
  const opts = document.getElementById("opts");
  function render() {
    const total = votes.reduce((a, b) => a + b, 0);
    opts.innerHTML = "";
    OPTIONS.forEach((name, i) => {
      const pct = total ? Math.round(votes[i] / total * 100) : 0;
      const d = document.createElement("div");
      d.className = "opt";
      d.innerHTML = "<div class='bar'><div class='fill' style='width:" + pct + "%'></div><span class='label'>" + name + " — " + pct + "% (" + votes[i] + ")</span></div>";
      d.onclick = () => { votes[i]++; render(); };
      opts.appendChild(d);
    });
    document.getElementById("total").textContent = total + " suara";
  }
  render();
</script>
</body>
</html>
