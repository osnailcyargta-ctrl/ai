<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kembang Api</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  p { position: fixed; top: 10px; width: 100%; text-align: center; color: #888; font-family: sans-serif; margin: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>klik di mana aja</p>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  let sparks = 80; // jumlah percikan
  let particles = [];

  function boom(x, y) {
    const hue = Math.random() * 360;
    for (let i = 0; i < sparks; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 5;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 60 + Math.random() * 40, hue: hue + Math.random() * 30 });
    }
  }
  cv.onclick = (e) => boom(e.clientX, e.clientY);
  setInterval(() => boom(Math.random() * cv.width, Math.random() * cv.height * 0.6), 900);

  function loop() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (const p of particles) {
      p.vy += 0.05;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      ctx.fillStyle = "hsla(" + p.hue + ", 100%, 60%, " + p.life / 100 + ")";
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    particles = particles.filter((p) => p.life > 0);
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
