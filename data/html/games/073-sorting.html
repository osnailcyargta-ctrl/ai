<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sorting</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a2e; color: #eee; font-family: sans-serif; text-align: center; }
  canvas { background: #16213e; }
  button { font-size: 16px; margin: 6px; padding: 6px 14px; }
</style>
</head>
<body>
<div>
  <canvas id="c" width="500" height="300"></canvas>
  <p><button id="shuffle">acak</button><button id="bubble">bubble sort</button><button id="insert">insertion sort</button></p>
</div>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let count = 50; // jumlah batang
  let delay = 20; // jeda animasi (ms)
  let arr = [], active = [], busy = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function shuffle() { arr = Array.from({ length: count }, () => 10 + Math.random() * 280); active = []; draw(); }
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const w = cv.width / arr.length;
    arr.forEach((v, i) => {
      ctx.fillStyle = active.includes(i) ? "#e94560" : "#0f9b8e";
      ctx.fillRect(i * w + 1, cv.height - v, w - 2, v);
    });
  }

  async function bubble() {
    for (let i = 0; i < arr.length; i++) for (let j = 0; j < arr.length - i - 1; j++) {
      active = [j, j + 1];
      if (arr[j] > arr[j + 1]) [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
      draw(); await sleep(delay);
    }
  }
  async function insertion() {
    for (let i = 1; i < arr.length; i++) {
      let j = i;
      while (j > 0 && arr[j - 1] > arr[j]) { [arr[j - 1], arr[j]] = [arr[j], arr[j - 1]]; active = [j, j - 1]; j--; draw(); await sleep(delay); }
    }
  }
  async function run(fn) { if (busy) return; busy = true; await fn(); active = []; draw(); busy = false; }

  document.getElementById("shuffle").onclick = () => { if (!busy) shuffle(); };
  document.getElementById("bubble").onclick = () => run(bubble);
  document.getElementById("insert").onclick = () => run(insertion);
  shuffle();
</script>
</body>
</html>
