<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ganti Warna</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: monospace; transition: background 0.4s; background: #222; }
  #box { width: 200px; height: 200px; border-radius: 20px; cursor: pointer; transition: background 0.3s, transform 0.2s; box-shadow: 0 10px 30px #0006; }
  #box:hover { transform: scale(1.05); }
  p { text-align: center; color: #fff; font-size: 20px; }
</style>
</head>
<body>
<div>
  <div id="box"></div>
  <p id="code"></p>
</div>
<script>
  const box = document.getElementById("box"), code = document.getElementById("code");
  const rand = () => "#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0");
  function change() {
    const c = rand();
    box.style.background = c;
    document.body.style.background = c + "55";
    code.textContent = c;
  }
  box.onclick = change;
  change();
</script>
</body>
</html>
