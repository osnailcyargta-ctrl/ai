<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Halo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #a8edea, #fed6e3); font-family: sans-serif; text-align: center; }
  input { font-size: 20px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
  button { font-size: 20px; padding: 8px 16px; border-radius: 8px; border: none; background: #6c5ce7; color: #fff; cursor: pointer; }
  #hello { font-size: 30px; margin-top: 20px; min-height: 40px; }
</style>
</head>
<body>
<div>
  <h2>Siapa nama kamu?</h2>
  <input id="name" placeholder="nama"> <button id="go">sapa</button>
  <div id="hello"></div>
</div>
<script>
  const nameEl = document.getElementById("name"), hello = document.getElementById("hello");
  const GREETS = ["Halo", "Hai", "Yo", "Selamat datang", "Apa kabar"];
  function greet() {
    const n = nameEl.value.trim();
    if (!n) { hello.textContent = "isi nama dulu dong"; return; }
    const h = new Date().getHours();
    const time = h < 11 ? "pagi" : h < 15 ? "siang" : h < 18 ? "sore" : "malam";
    hello.textContent = GREETS[Math.floor(Math.random() * GREETS.length)] + ", " + n + "! Selamat " + time + " 👋";
  }
  document.getElementById("go").onclick = greet;
  nameEl.onkeydown = (e) => { if (e.key === "Enter") greet(); };
</script>
</body>
</html>
