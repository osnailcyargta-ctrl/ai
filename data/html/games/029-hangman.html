<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tebak Kata</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2d3142; color: #fff; font-family: monospace; text-align: center; }
  #word { font-size: 40px; letter-spacing: 8px; }
  .keys button { width: 34px; height: 38px; margin: 3px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; }
  .keys button:disabled { opacity: 0.3; }
</style>
</head>
<body>
<div>
  <h2 id="lives">Nyawa: ❤️❤️❤️❤️❤️❤️</h2>
  <div id="word"></div>
  <p id="msg">tebak hurufnya</p>
  <div class="keys" id="keys"></div>
</div>
<script>
  const WORDS = ["harimau", "pesawat", "semangka", "komputer", "gitar", "jerapah", "lemari", "sepatu"];
  let maxLives = 6; // nyawa
  let word, guessed, lives;
  const wordEl = document.getElementById("word"), msg = document.getElementById("msg"), livesEl = document.getElementById("lives"), keysEl = document.getElementById("keys");

  function start() {
    word = WORDS[Math.floor(Math.random() * WORDS.length)];
    guessed = new Set();
    lives = maxLives;
    keysEl.innerHTML = "";
    for (const ch of "abcdefghijklmnopqrstuvwxyz") {
      const b = document.createElement("button");
      b.textContent = ch;
      b.onclick = () => guess(ch, b);
      keysEl.appendChild(b);
    }
    msg.textContent = "tebak hurufnya";
    render();
  }

  function guess(ch, b) {
    if (lives <= 0 || done()) return;
    guessed.add(ch);
    b.disabled = true;
    if (!word.includes(ch)) lives--;
    render();
    if (done()) { msg.textContent = "Bener! 🎉 klik di sini buat kata baru"; msg.onclick = start; }
    else if (lives <= 0) { msg.textContent = "Kalah, katanya: " + word + " (klik buat ulang)"; msg.onclick = start; }
  }

  const done = () => [...word].every((c) => guessed.has(c));
  function render() {
    wordEl.textContent = [...word].map((c) => (guessed.has(c) ? c : "_")).join("");
    livesEl.textContent = "Nyawa: " + "❤️".repeat(lives) + "🖤".repeat(maxLives - lives);
  }
  start();
</script>
</body>
</html>
