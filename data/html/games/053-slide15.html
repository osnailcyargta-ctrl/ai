<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Puzzle 15</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #283618; color: #fefae0; font-family: sans-serif; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 6px; }
  .t { width: 70px; height: 70px; border-radius: 8px; background: #dda15e; color: #283618; font-size: 28px; font-weight: bold; display: grid; place-items: center; cursor: pointer; }
  .t.empty { background: transparent; cursor: default; }
</style>
</head>
<body>
<div>
  <h2 id="msg">urutin 1 sampai 15</h2>
  <div class="grid" id="grid"></div>
</div>
<script>
  const gridEl = document.getElementById("grid"), msg = document.getElementById("msg");
  let tiles = [...Array(15).keys()].map((i) => i + 1).concat(0), moves = 0;

  function neighbors(i) {
    const x = i % 4, y = Math.floor(i / 4), out = [];
    if (x > 0) out.push(i - 1);
    if (x < 3) out.push(i + 1);
    if (y > 0) out.push(i - 4);
    if (y < 3) out.push(i + 4);
    return out;
  }
  function slide(i) {
    const e = tiles.indexOf(0);
    if (!neighbors(e).includes(i)) return false;
    [tiles[e], tiles[i]] = [tiles[i], tiles[e]];
    return true;
  }
  for (let k = 0; k < 300; k++) { const n = neighbors(tiles.indexOf(0)); slide(n[Math.floor(Math.random() * n.length)]); }

  function render() {
    gridEl.innerHTML = "";
    tiles.forEach((v, i) => {
      const d = document.createElement("div");
      d.className = "t" + (v ? "" : " empty");
      d.textContent = v || "";
      d.onclick = () => { if (slide(i)) { moves++; render(); } };
      gridEl.appendChild(d);
    });
    const solved = tiles.every((v, i) => v === (i + 1) % 16);
    msg.textContent = solved ? "Beres! " + moves + " langkah 🎉" : "Langkah: " + moves;
  }
  render();
</script>
</body>
</html>
