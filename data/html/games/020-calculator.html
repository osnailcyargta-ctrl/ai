<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kalkulator</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1c1c; font-family: sans-serif; }
  .calc { width: 260px; background: #2d2d2d; padding: 14px; border-radius: 16px; }
  #screen { background: #111; color: #0f0; font-size: 30px; text-align: right; padding: 12px; border-radius: 8px; min-height: 40px; overflow: hidden; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .keys button { font-size: 22px; padding: 14px 0; border: none; border-radius: 10px; background: #444; color: #fff; cursor: pointer; }
  .keys button.op { background: #ff9500; }
</style>
</head>
<body>
<div class="calc">
  <div id="screen">0</div>
  <div class="keys" id="keys"></div>
</div>
<script>
  const screen = document.getElementById("screen"), keysEl = document.getElementById("keys");
  const KEYS = ["7", "8", "9", "/", "4", "5", "6", "*", "1", "2", "3", "-", "0", ".", "=", "+", "C"];
  let expr = "";

  for (const k of KEYS) {
    const b = document.createElement("button");
    b.textContent = k;
    if ("+-*/=C".includes(k)) b.className = "op";
    b.onclick = () => press(k);
    keysEl.appendChild(b);
  }

  function press(k) {
    if (k === "C") expr = "";
    else if (k === "=") {
      try { expr = String(Math.round(Function("return " + expr)() * 1e8) / 1e8); }
      catch (e) { expr = ""; screen.textContent = "error"; return; }
    } else expr += k;
    screen.textContent = expr || "0";
  }
  onkeydown = (e) => {
    if ("0123456789.+-*/".includes(e.key)) press(e.key);
    if (e.key === "Enter") press("=");
    if (e.key === "Backspace") { expr = expr.slice(0, -1); screen.textContent = expr || "0"; }
  };
</script>
</body>
</html>
