<!-- request: helikopter terbang di gua | tahan spasi biar naik || helicopter cave game | hold space to fly up through the cave -->
<!-- things: ride=helikopter:🚁 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gua Helikopter</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: monospace; }
  canvas { background: #111; }
</style>
</head>
<body>
<canvas id="game" width="520" height="320"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, STEP = 10;
  let lift = 0.35; // dorongan naik
  let gravity = 0.25; // gravitasi
  let gap = 180; // lebar gua
  let y, vy, cave, dist, over, holding = false;

  function reset() {
    y = H / 2; vy = 0; dist = 0; over = false;
    cave = [];
    let mid = H / 2;
    for (let x = 0; x <= W + STEP; x += STEP) cave.push(mid);
  }
  onkeydown = (e) => { if (e.key === " ") { holding = true; if (over) reset(); } };
  onkeyup = (e) => { if (e.key === " ") holding = false; };
  cv.onmousedown = () => { holding = true; if (over) reset(); };
  cv.onmouseup = () => { holding = false; };

  function update() {
    if (over) return;
    vy += holding ? -lift : gravity;
    vy = Math.max(-5, Math.min(5, vy));
    y += vy;
    dist++;
    if (dist % 4 === 0) {
      cave.shift();
      const last = cave[cave.length - 1];
      cave.push(Math.max(gap / 2 + 10, Math.min(H - gap / 2 - 10, last + (Math.random() * 40 - 20))));
    }
    const mid = cave[Math.floor(80 / STEP)];
    const g = gap - Math.min(80, dist / 50);
    if (y < mid - g / 2 + 10 || y > mid + g / 2 - 10) over = true;
  }

  function draw() {
    ctx.fillStyle = "#3a2e1f";
    ctx.fillRect(0, 0, W, H);
    const g = gap - Math.min(80, dist / 50);
    ctx.fillStyle = "#111";
    cave.forEach((mid, i) => ctx.fillRect(i * STEP, mid - g / 2, STEP + 1, g));
    ctx.font = "26px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🚁", 80, y);
    ctx.fillStyle = "#fff";
    ctx.font = "16px monospace";
    ctx.fillText("JARAK " + dist, W / 2, 16);
    if (over) ctx.fillText("NABRAK! SPASI BUAT ULANG", W / 2, H / 2);
  }

  reset();
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
