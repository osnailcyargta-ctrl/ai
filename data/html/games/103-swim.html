<!-- request: ikan berenang hindarin hiu | game ikan kecil kabur dari hiu || a fish swimming away from sharks | little fish avoiding sharks -->
<!-- things: hero=ikan:🐠 foe=hiu:🦈 item=gelembung:🫧 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ikan vs Hiu</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #03045e; color: #fff; font-family: sans-serif; }
  canvas { background: linear-gradient(#48cae4, #023e8a); border-radius: 10px; }
</style>
</head>
<body>
<canvas id="game" width="560" height="340"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  let swimPower = 0.5; // dorongan renang
  let foeSpeed = 3; // kecepatan hiu
  let hero, foes, items, score, over;

  function reset() { hero = { x: 90, y: H / 2, vy: 0 }; foes = []; items = []; score = 0; over = false; }
  const keys = {};
  onkeydown = (e) => { keys[e.key] = true; if (over && e.key === " ") reset(); };
  onkeyup = (e) => { keys[e.key] = false; };

  function update() {
    if (over) return;
    if (keys["ArrowUp"] || keys[" "]) hero.vy -= swimPower;
    if (keys["ArrowDown"]) hero.vy += swimPower;
    hero.vy *= 0.92;
    hero.y = Math.max(16, Math.min(H - 16, hero.y + hero.vy));
    if (Math.random() < 0.02 + score / 5000) foes.push({ x: W + 30, y: 20 + Math.random() * (H - 40), v: foeSpeed + Math.random() * 2 });
    if (Math.random() < 0.02) items.push({ x: W + 20, y: 20 + Math.random() * (H - 40) });
    for (const f of foes) { f.x -= f.v; if (Math.hypot(f.x - hero.x, f.y - hero.y) < 26) over = true; }
    for (const it of items) { it.x -= 2; if (Math.hypot(it.x - hero.x, it.y - hero.y) < 22) { it.got = true; score++; } }
    foes = foes.filter((f) => f.x > -40);
    items = items.filter((it) => !it.got && it.x > -20);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "22px serif";
    for (const it of items) ctx.fillText("🫧", it.x, it.y);
    ctx.font = "42px serif";
    for (const f of foes) ctx.fillText("🦈", f.x, f.y);
    ctx.save();
    ctx.translate(hero.x, hero.y);
    ctx.scale(-1, 1);
    ctx.font = "30px serif";
    ctx.fillText("🐠", 0, 0);
    ctx.restore();
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText("Gelembung: " + score, W / 2, 16);
    if (over) { ctx.font = "26px sans-serif"; ctx.fillText("Dimakan hiu! spasi = ulang", W / 2, H / 2); }
  }

  reset();
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
