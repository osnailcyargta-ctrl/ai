<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kuis Matematika</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #3a0ca3; color: #fff; font-family: sans-serif; text-align: center; }
  #q { font-size: 48px; margin: 10px; }
  input { font-size: 28px; width: 140px; text-align: center; border-radius: 10px; border: none; padding: 6px; }
  #feedback { font-size: 22px; min-height: 30px; }
</style>
</head>
<body>
<div>
  <p id="status"></p>
  <div id="q"></div>
  <input id="answer" type="number" autofocus>
  <p id="feedback">ketik jawaban terus enter</p>
</div>
<script>
  let total = 10; // jumlah soal
  let maxNum = 10; // angka paling gede
  let op = "*"; // operasi: + - *
  let n = 0, score = 0, a, b, right;
  const qEl = document.getElementById("q"), input = document.getElementById("answer");
  const fb = document.getElementById("feedback"), status = document.getElementById("status");

  function next() {
    if (n >= total) {
      qEl.textContent = "Selesai!";
      status.textContent = "Nilai: " + Math.round(score / total * 100);
      fb.textContent = "enter buat ulang";
      return;
    }
    a = 1 + Math.floor(Math.random() * maxNum);
    b = 1 + Math.floor(Math.random() * maxNum);
    right = op === "+" ? a + b : op === "-" ? a - b : a * b;
    qEl.textContent = a + " " + (op === "*" ? "×" : op) + " " + b + " = ?";
    status.textContent = "Soal " + (n + 1) + "/" + total + " · Benar " + score;
  }

  input.onkeydown = (e) => {
    if (e.key !== "Enter") return;
    if (n >= total) { n = 0; score = 0; next(); return; }
    if (Number(input.value) === right) { score++; fb.textContent = "✅ benar!"; }
    else fb.textContent = "❌ salah, jawabannya " + right;
    input.value = "";
    n++;
    next();
  };
  next();
</script>
</body>
</html>
