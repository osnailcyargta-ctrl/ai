<!-- request: animasi bintang terbang kayak warp | starfield luar angkasa || starfield warp speed | flying through space stars -->
<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Starfield</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  let count = 400; // jumlah bintang
  let warp = 8; // kecepatan
  const stars = Array.from({ length: count }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() }));
  onmousedown = () => { warp = 30; };
  onmouseup = () => { warp = 8; };

  function loop() {
    const cx = cv.width / 2, cy = cv.height / 2;
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      const px = cx + s.x / s.z * cx, py = cy + s.y / s.z * cy;
      s.z -= warp / 1000;
      if (s.z <= 0.01) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; continue; }
      const nx = cx + s.x / s.z * cx, ny = cy + s.y / s.z * cy;
      ctx.strokeStyle = "rgba(255, 255, 255, " + (1 - s.z) + ")";
      ctx.lineWidth = (1 - s.z) * 3;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
