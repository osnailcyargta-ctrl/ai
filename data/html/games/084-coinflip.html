<!-- request: lempar koin | coin flip gambar atau angka || coin flip | flip a coin heads or tails -->
<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lempar Koin</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b263b; color: #e0e1dd; font-family: sans-serif; text-align: center; }
  #coin { width: 140px; height: 140px; border-radius: 50%; margin: 20px auto; background: radial-gradient(#ffe066, #f4a300); color: #7a4f01; font-size: 26px; font-weight: bold; display: grid; place-items: center; transition: transform 0.8s; }
  button { font-size: 20px; padding: 10px 22px; border-radius: 10px; border: none; cursor: pointer; }
</style>
</head>
<body>
<div>
  <div id="coin">?</div>
  <button id="flip">lempar!</button>
  <p id="stats">Gambar 0 · Angka 0</p>
</div>
<script>
  const coin = document.getElementById("coin"), stats = document.getElementById("stats");
  let heads = 0, tails = 0, turns = 0;
  document.getElementById("flip").onclick = () => {
    const isHeads = Math.random() < 0.5;
    turns += 5 + (isHeads ? 0 : 0.5);
    coin.style.transform = "rotateY(" + turns * 360 + "deg)";
    coin.textContent = "";
    setTimeout(() => {
      coin.textContent = isHeads ? "GAMBAR" : "ANGKA";
      if (isHeads) heads++; else tails++;
      stats.textContent = "Gambar " + heads + " · Angka " + tails;
    }, 800);
  };
</script>
</body>
</html>
