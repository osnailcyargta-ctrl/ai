<!-- request: timer pomodoro belajar | pomodoro 25 menit fokus 5 menit istirahat || pomodoro study timer | 25 minute focus timer with breaks -->
<!-- things: -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pomodoro</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: sans-serif; text-align: center; color: #fff; transition: background 0.5s; }
  #time { font-size: 90px; font-weight: bold; }
  button { font-size: 18px; padding: 10px 20px; margin: 6px; border-radius: 10px; border: none; background: #fff3; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div>
  <h2 id="mode">Fokus</h2>
  <div id="time">25:00</div>
  <button id="start">mulai</button>
  <button id="skip">lewati</button>
  <p id="count">Sesi selesai: 0</p>
</div>
<script>
  let focusMin = 25; // menit fokus
  let breakMin = 5; // menit istirahat
  let mode = "focus", left = focusMin * 60, timer = null, done = 0;
  const timeEl = document.getElementById("time"), modeEl = document.getElementById("mode"), startBtn = document.getElementById("start");

  function render() {
    timeEl.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    modeEl.textContent = mode === "focus" ? "Fokus 📚" : "Istirahat ☕";
    document.body.style.background = mode === "focus" ? "#d62828" : "#2a9d8f";
    document.title = timeEl.textContent + " · " + modeEl.textContent;
  }
  function switchMode() {
    if (mode === "focus") { done++; document.getElementById("count").textContent = "Sesi selesai: " + done; }
    mode = mode === "focus" ? "break" : "focus";
    left = (mode === "focus" ? focusMin : breakMin) * 60;
    render();
  }
  startBtn.onclick = () => {
    if (timer) { clearInterval(timer); timer = null; startBtn.textContent = "lanjut"; return; }
    startBtn.textContent = "pause";
    timer = setInterval(() => { left--; if (left <= 0) switchMode(); render(); }, 1000);
  };
  document.getElementById("skip").onclick = switchMode;
  render();
</script>
</body>
</html>
