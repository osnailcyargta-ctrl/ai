<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DVD</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  #logo { position: absolute; font: bold 48px sans-serif; user-select: none; }
</style>
</head>
<body>
<div id="logo">DVD</div>
<script>
  const logo = document.getElementById("logo");
  let speed = 2.5; // kecepatan
  let x = 50, y = 50, vx = speed, vy = speed, corners = 0;

  function recolor() { logo.style.color = "hsl(" + Math.floor(Math.random() * 360) + ", 90%, 60%)"; }

  function loop() {
    const w = logo.offsetWidth, h = logo.offsetHeight;
    x += vx; y += vy;
    let hits = 0;
    if (x <= 0 || x + w >= innerWidth) { vx *= -1; hits++; }
    if (y <= 0 || y + h >= innerHeight) { vy *= -1; hits++; }
    if (hits) recolor();
    if (hits === 2) { corners++; document.title = "Pojok: " + corners; }
    x = Math.max(0, Math.min(innerWidth - w, x));
    y = Math.max(0, Math.min(innerHeight - h, y));
    logo.style.left = x + "px";
    logo.style.top = y + "px";
    requestAnimationFrame(loop);
  }
  recolor();
  loop();
</script>
</body>
</html>
