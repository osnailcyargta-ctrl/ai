<!-- request: tangkap apel yang jatuh pake keranjang | game nangkep buah jatuh || catch the falling apples | catch falling fruit with a basket -->
<!-- things: item=apel:🍎 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tangkap Apel</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0f1a12; color: #eee; font-family: sans-serif; }
  canvas { background: linear-gradient(#7ec8ff, #d9f2ff); border-radius: 8px; }
</style>
</head>
<body>
<canvas id="game" width="480" height="360"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  let speed = 6; // kecepatan keranjang
  let goal = 20; // target skor buat menang
  let missMax = 5; // boleh jatuh berapa kali
  let score = 0, missed = 0;
  const basket = { x: W / 2, y: H - 24, w: 70 };
  let items = [];
  const keys = {};
  onkeydown = (e) => { keys[e.key] = true; if (e.key === " " && (missed >= missMax || score >= goal)) { score = 0; missed = 0; items = []; } };
  onkeyup = (e) => { keys[e.key] = false; };
  cv.onmousemove = (e) => { basket.x = e.offsetX; };

  function update() {
    if (missed >= missMax || score >= goal) return;
    if (keys["ArrowLeft"]) basket.x -= speed;
    if (keys["ArrowRight"]) basket.x += speed;
    basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));
    if (Math.random() < 0.025) items.push({ x: 20 + Math.random() * (W - 40), y: -10, vy: 2 + Math.random() * 2 });
    for (const it of items) {
      it.y += it.vy;
      if (it.y > basket.y - 14 && Math.abs(it.x - basket.x) < basket.w / 2) { it.done = true; score++; }
      else if (it.y > H + 10) { it.done = true; missed++; }
    }
    items = items.filter((it) => !it.done);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(basket.x - basket.w / 2, basket.y - 10, basket.w, 20);
    ctx.font = "26px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const it of items) ctx.fillText("🍎", it.x, it.y);
    ctx.fillStyle = "#123";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Apel: " + score + "/" + goal + "   Jatuh: " + missed + "/" + missMax, 10, 18);
    ctx.textAlign = "center";
    ctx.font = "30px sans-serif";
    if (score >= goal) ctx.fillText("Menang! 🎉", W / 2, H / 2);
    if (missed >= missMax) ctx.fillText("Kebanyakan jatuh!", W / 2, H / 2);
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
