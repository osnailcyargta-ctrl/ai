<!-- request: bullet hell hindarin peluru | game menghindar dari banyak peluru || bullet hell dodging | dodge a storm of bullets -->
<!-- things: hero=hati:💖 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bullet Hell</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: monospace; }
  canvas { background: #0a0a14; border: 2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="420" height="420"></canvas>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, C = { x: W / 2, y: H / 2 };
  let speed = 3; // kecepatan pemain
  let bulletSpeed = 2; // kecepatan peluru
  let hero, bullets, t, over;
  const keys = {};
  onkeydown = (e) => { keys[e.key] = true; if (over && e.key === "Enter") reset(); };
  onkeyup = (e) => { keys[e.key] = false; };

  function reset() { hero = { x: W / 2, y: H - 60 }; bullets = []; t = 0; over = false; }

  function update() {
    if (over) return;
    t++;
    const s = keys["Shift"] ? speed / 2 : speed;
    if (keys["ArrowLeft"]) hero.x -= s;
    if (keys["ArrowRight"]) hero.x += s;
    if (keys["ArrowUp"]) hero.y -= s;
    if (keys["ArrowDown"]) hero.y += s;
    hero.x = Math.max(8, Math.min(W - 8, hero.x));
    hero.y = Math.max(8, Math.min(H - 8, hero.y));
    if (t % 8 === 0) {
      const n = 10, base = t / 30;
      for (let k = 0; k < n; k++) {
        const a = base + k * Math.PI * 2 / n;
        bullets.push({ x: C.x, y: C.y, vx: Math.cos(a) * (bulletSpeed + t / 3000), vy: Math.sin(a) * (bulletSpeed + t / 3000) });
      }
    }
    for (const b of bullets) {
      b.x += b.vx; b.y += b.vy;
      if (Math.hypot(b.x - hero.x, b.y - hero.y) < 7) over = true;
    }
    bullets = bullets.filter((b) => b.x > -10 && b.x < W + 10 && b.y > -10 && b.y < H + 10);
  }

  function draw() {
    ctx.fillStyle = "#0a0a14";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ff4d6d";
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.font = "16px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("💖", hero.x, hero.y);
    ctx.fillStyle = "#fff";
    ctx.font = "15px monospace";
    ctx.fillText("BERTAHAN " + (t / 60).toFixed(1) + " DETIK", W / 2, 16);
    if (over) ctx.fillText("KENA! ENTER BUAT ULANG", W / 2, H / 2 + 40);
  }

  reset();
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
