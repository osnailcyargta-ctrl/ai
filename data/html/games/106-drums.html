<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drum Pad</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
  .pads { display: grid; grid-template-columns: repeat(3, 110px); gap: 12px; }
  .pad { height: 110px; border-radius: 14px; background: #2b2d42; display: grid; place-items: center; font-size: 18px; cursor: pointer; user-select: none; transition: transform 0.05s; }
  .pad.hit { transform: scale(0.94); background: #ef233c; }
</style>
</head>
<body>
<div>
  <h2>Drum Pad 🥁</h2>
  <div class="pads" id="pads"></div>
</div>
<script>
  let audio = null;
  const SOUNDS = [
    ["Kick", "q", (t) => tone(t, 120, 40, 0.5, "sine")],
    ["Snare", "w", (t) => noise(t, 0.2)],
    ["Hi-hat", "e", (t) => noise(t, 0.05)],
    ["Tom", "a", (t) => tone(t, 200, 100, 0.3, "sine")],
    ["Clap", "s", (t) => { noise(t, 0.08); noise(t + 0.03, 0.08); }],
    ["Bell", "d", (t) => tone(t, 880, 880, 0.6, "triangle")],
  ];
  function tone(t, f1, f2, len, type) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + len);
  }
  function noise(t, len) {
    const buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = audio.createBufferSource();
    src.buffer = buf;
    src.connect(audio.destination);
    src.start(t);
  }
  const byKey = {};
  for (const [name, key, play] of SOUNDS) {
    const el = document.createElement("div");
    el.className = "pad";
    el.textContent = name + " (" + key.toUpperCase() + ")";
    const hit = () => { audio = audio || new AudioContext(); play(audio.currentTime); el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 100); };
    el.onmousedown = hit;
    byKey[key] = hit;
    document.getElementById("pads").appendChild(el);
  }
  onkeydown = (e) => { if (byKey[e.key] && !e.repeat) byKey[e.key](); };
</script>
</body>
</html>
