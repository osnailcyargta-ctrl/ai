<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stopwatch</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f0f; color: #f5f5f5; font-family: monospace; text-align: center; }
  #time { font-size: 64px; }
  button { font-size: 18px; padding: 10px 20px; margin: 6px; border-radius: 30px; border: 1px solid #555; background: #222; color: #fff; cursor: pointer; }
  ol { text-align: left; }
</style>
</head>
<body>
<div>
  <div id="time">00:00.00</div>
  <button id="start">mulai</button>
  <button id="lap">lap</button>
  <button id="reset">reset</button>
  <ol id="laps"></ol>
</div>
<script>
  const timeEl = document.getElementById("time"), laps = document.getElementById("laps"), startBtn = document.getElementById("start");
  let elapsed = 0, startAt = 0, running = false;

  function fmt(ms) {
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0");
  }
  const now = () => elapsed + (running ? performance.now() - startAt : 0);

  startBtn.onclick = () => {
    if (running) { elapsed = now(); running = false; startBtn.textContent = "lanjut"; }
    else { startAt = performance.now(); running = true; startBtn.textContent = "stop"; }
  };
  document.getElementById("lap").onclick = () => {
    if (!running) return;
    const li = document.createElement("li");
    li.textContent = fmt(now());
    laps.appendChild(li);
  };
  document.getElementById("reset").onclick = () => { elapsed = 0; running = false; startBtn.textContent = "mulai"; laps.innerHTML = ""; };

  function tick() { timeEl.textContent = fmt(now()); requestAnimationFrame(tick); }
  tick();
</script>
</body>
</html>
