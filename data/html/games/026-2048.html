<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>2048</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8ef; color: #776e65; font-family: sans-serif; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; background: #bbada0; padding: 10px; border-radius: 8px; }
  .tile { width: 80px; height: 80px; border-radius: 6px; background: #cdc1b4; font-size: 30px; font-weight: bold; display: grid; place-items: center; }
</style>
</head>
<body>
<div>
  <h1 id="score">Skor: 0</h1>
  <div class="grid" id="grid"></div>
  <p>pake panah</p>
</div>
<script>
  const gridEl = document.getElementById("grid"), scoreEl = document.getElementById("score");
  const COLORS = { 2: "#eee4da", 4: "#ede0c8", 8: "#f2b179", 16: "#f59563", 32: "#f67c5f", 64: "#f65e3b", 128: "#edcf72", 256: "#edcc61", 512: "#edc850", 1024: "#edc53f", 2048: "#edc22e" };
  let board = Array(16).fill(0), score = 0;
  const tiles = [];
  for (let i = 0; i < 16; i++) { const t = document.createElement("div"); t.className = "tile"; gridEl.appendChild(t); tiles.push(t); }

  function addTile() {
    const free = board.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
    if (free.length) board[free[Math.floor(Math.random() * free.length)]] = Math.random() < 0.9 ? 2 : 4;
  }

  function slide(row) {
    const vals = row.filter((v) => v);
    for (let i = 0; i < vals.length - 1; i++) if (vals[i] === vals[i + 1]) { vals[i] *= 2; score += vals[i]; vals.splice(i + 1, 1); }
    while (vals.length < 4) vals.push(0);
    return vals;
  }

  function move(dir) {
    const before = board.join();
    for (let k = 0; k < 4; k++) {
      let idx = [0, 1, 2, 3].map((j) => (dir === "left" || dir === "right" ? k * 4 + j : j * 4 + k));
      if (dir === "right" || dir === "down") idx = idx.reverse();
      const out = slide(idx.map((i) => board[i]));
      idx.forEach((i, j) => { board[i] = out[j]; });
    }
    if (board.join() !== before) addTile();
    render();
  }

  function render() {
    board.forEach((v, i) => {
      tiles[i].textContent = v || "";
      tiles[i].style.background = COLORS[v] || (v ? "#3c3a32" : "#cdc1b4");
      tiles[i].style.color = v > 4 ? "#fff" : "#776e65";
    });
    scoreEl.textContent = "Skor: " + score + (board.includes(2048) ? " · MENANG!" : "");
  }

  onkeydown = (e) => {
    const d = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" }[e.key];
    if (d) { e.preventDefault(); move(d); }
  };
  addTile(); addTile(); render();
</script>
</body>
</html>
