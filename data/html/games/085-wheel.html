<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Roda Putar</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #3c096c; color: #fff; font-family: sans-serif; text-align: center; }
  canvas { cursor: pointer; }
  #result { font-size: 26px; min-height: 36px; }
</style>
</head>
<body>
<div>
  <div>▼</div>
  <canvas id="c" width="360" height="360"></canvas>
  <p id="result">klik rodanya</p>
</div>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d"), result = document.getElementById("result");
  const PRIZES = ["Pulsa", "Zonk", "Es krim", "Coba lagi", "Jackpot", "Permen", "Zonk", "Voucher"];
  const COLORS = ["#ff006e", "#fb5607", "#ffbe0b", "#8338ec", "#3a86ff", "#06d6a0", "#ef476f", "#118ab2"];
  let angle = 0, vel = 0;

  function draw() {
    const n = PRIZES.length, slice = Math.PI * 2 / n;
    ctx.clearRect(0, 0, 360, 360);
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = COLORS[i];
      ctx.beginPath(); ctx.moveTo(180, 180); ctx.arc(180, 180, 170, angle + i * slice, angle + (i + 1) * slice); ctx.fill();
      ctx.save();
      ctx.translate(180, 180);
      ctx.rotate(angle + (i + 0.5) * slice);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(PRIZES[i], 70, 6);
      ctx.restore();
    }
  }
  cv.onclick = () => { if (vel < 0.001) { vel = 0.3 + Math.random() * 0.3; result.textContent = "muter..."; } };

  function loop() {
    if (vel > 0) {
      angle += vel;
      vel *= 0.985;
      if (vel < 0.001) {
        vel = 0;
        const slice = Math.PI * 2 / PRIZES.length;
        const at = ((-Math.PI / 2 - angle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        result.textContent = "Dapet: " + PRIZES[Math.floor(at / slice)] + "!";
      }
    }
    draw();
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
