<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jokes Receh</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffd166; color: #073b4c; font-family: sans-serif; text-align: center; }
  .card { width: 360px; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 6px 0 #ef476f; }
  #q { font-size: 20px; min-height: 50px; }
  #a { font-size: 18px; color: #ef476f; min-height: 30px; }
  button { font-size: 17px; padding: 8px 16px; margin: 4px; border-radius: 10px; border: none; background: #118ab2; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div id="q"></div>
  <div id="a"></div>
  <button id="show">jawabannya?</button>
  <button id="next">jokes lain</button>
</div>
<script>
  const JOKES = [
    ["Kenapa ayam nyebrang jalan?", "Karena mau ke seberang."],
    ["Sayur apa yang dingin?", "Kembang kol (kol-d)."],
    ["Hewan apa yang paling sabar?", "Kukang, soalnya slow."],
    ["Kenapa komputer ga pernah laper?", "Udah punya banyak byte."],
    ["Buah apa yang suka ngeluh?", "Ah-pukat."],
    ["Ikan apa yang bisa terbang?", "Lele-lawar."],
  ];
  const q = document.getElementById("q"), a = document.getElementById("a");
  let current = -1;

  function next() {
    let k;
    do k = Math.floor(Math.random() * JOKES.length); while (k === current);
    current = k;
    q.textContent = JOKES[k][0];
    a.textContent = "";
  }
  document.getElementById("show").onclick = () => { a.textContent = JOKES[current][1] + " 😂"; };
  document.getElementById("next").onclick = next;
  next();
</script>
</body>
</html>
